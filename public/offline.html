<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Workboard</title>
<style>
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f5f4f0;color:#1d1c1a;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;padding:16px}
  .box{max-width:360px;text-align:center}
  img{width:64px;height:64px;border-radius:16px}
  h1{font-family:Georgia,serif;font-size:24px;margin:16px 0 6px}
  p{color:#5f5c55;line-height:1.5;margin:0 0 20px}
  button{background:#1f6f5c;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:600;font-size:14px}
</style>
</head>
<body>
<div class="box">
  <img src="/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Workboard needs an internet connection to show your tasks. Check your connection and try again.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
